name: 'SOAR sync branch checks'

# The upstream test suite, run on every push of a sync branch (sync/vX.Y.Z) so
# the results show on its sync PR and gate promotion. Mirrors the upstream
# ci.yml and e2e-tests.yml, which only run for main. Runs on push rather than
# pull_request because GitHub runs no pull_request workflows for a PR it cannot
# merge, which a sync PR into soar often is. See SOAR-FORK.md.
on:
  push:
    branches: ['sync/v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-install
      - run: npm run lint

  build_app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-install
      - run: cp .env.example .env
      - run: npm run build

  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the image (not pushed)
        run: docker build -f docker/Dockerfile -t "documenso-sync:${GITHUB_SHA}" .

  e2e_tests:
    name: E2E Tests
    # Upstream runs this on a larger hosted runner; the standard runner is
    # slower, hence the longer timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - uses: ./.github/actions/node-install
      - name: Start services
        run: npm run dx:up
      - uses: ./.github/actions/playwright-install
      - name: Create the database
        run: npm run prisma:migrate-dev
      - name: Seed the database
        run: npm run prisma:seed
      - name: Run Playwright tests
        run: npm run ci
        env:
          NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: './example/cert.p12'
          DANGEROUS_BYPASS_RATE_LIMITS: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: 'packages/app-tests/**/test-results/*'
          retention-days: 7
